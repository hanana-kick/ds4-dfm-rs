name: V4.1 source workspace
on:
  push:
    branches: [feat/v41-continuous]
    paths: [.github/workflows/v41-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'hanana-kick/ds4-dfm-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source and read-only reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v41-source" "$RUNNER_TEMP/v41-reference"
          git archive --format=tar --prefix=dfm/ HEAD | gzip > "$RUNNER_TEMP/v41-source/dfm.tar.gz"
          git -C "$RUNNER_TEMP/v41-reference" init
          git -C "$RUNNER_TEMP/v41-reference" fetch --depth=1 https://github.com/JLFN/YoungAi.git a4e6d3177f310cabf3e8d5d214d437a7068ddf23
          git -C "$RUNNER_TEMP/v41-reference" archive --format=tar --prefix=youngai/ FETCH_HEAD | gzip > "$RUNNER_TEMP/v41-source/youngai.tar.gz"
          printf 'dfm=%s\nyoungai=%s\n' "$GITHUB_SHA" a4e6d3177f310cabf3e8d5d214d437a7068ddf23 > "$RUNNER_TEMP/v41-source/SOURCE_PINS"
      - uses: actions/upload-artifact@v4
        with:
          name: v41-source-workspace
          path: ${{ runner.temp }}/v41-source/
          retention-days: 7
          if-no-files-found: error
