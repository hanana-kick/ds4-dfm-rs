name: Apply reviewed DS41 feature patch
on:
  push:
    branches: [feat/ds41-entrpi-concurrency]
    paths: [.github/workflows/ds41-apply-reviewed-patch.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'hanana-kick/ds4-dfm-rs' && github.ref == 'refs/heads/feat/ds41-entrpi-concurrency'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reassemble exact locally tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ds41.patch.br
          for sha in \
            6469a7a5659688340b8cc43d027eff096b48c08f \
            3cb3911ed22782032e3cd0d700dcf04d65d3bc9a \
            26ab41aef19100587f015bfdf5d21a5f9a583430 \
            81d82f1a7fa793903668ab798ac6de744b443d2b \
            c440082d4ed0fae3c5b84259de573230f081c7a9; do
            gh api "repos/hanana-kick/ds4-dfm-rs/git/blobs/$sha" --jq .content | tr -d '\n' | base64 -d >> /tmp/ds41.patch.br
          done
          echo '37a32018b8541bbb078eeadcff6770d023398a821615e96bc31bd6e171dbfa7a  /tmp/ds41.patch.br' | sha256sum -c -
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/ds41.patch',z.brotliDecompressSync(fs.readFileSync('/tmp/ds41.patch.br')));"
          echo '9fbd2def5b000d47b8c346f8e283c95b6dc0e7898a4b088c31cb55ad176d9b90  /tmp/ds41.patch' | sha256sum -c -
          git apply --check /tmp/ds41.patch
          git apply /tmp/ds41.patch
          git diff --check
      - name: Commit only on the feature branch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/ds41-entrpi-concurrency
          git rm .github/workflows/ds41-apply-reviewed-patch.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ds41): add opt-in packed concurrent decode with isolated vision and Engram state' -m 'Entrpi-style single-owner admission plus the YoungAi V4.1 packed forward. C2-C8 is experimental and requires MTP off and prefix reuse off. Host checks passed locally; CUDA compilation, C4 numeric parity and live vision remain unqualified. See docs/ds41-concurrent-serving.md.'
          git push origin HEAD:refs/heads/feat/ds41-entrpi-concurrency
