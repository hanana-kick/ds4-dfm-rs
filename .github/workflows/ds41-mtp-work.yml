name: DS41 packed MTP implementation checks
on:
  push:
    branches: [work/ds41-packed-mtp-20261107]
    paths: [tools/apply-ds41-mtp.mjs, tools/finish-ds41-mtp.mjs, '.github/workflows/ds41-mtp-work.yml']
permissions:
  contents: write
concurrency:
  group: ds41-mtp-work
  cancel-in-progress: true
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ds41-packed-mtp-20261107
          fetch-depth: 0
      - name: Apply source changes
        run: |
          node tools/apply-ds41-mtp.mjs
          node tools/finish-ds41-mtp.mjs
      - name: Native syntax and transaction checks
        run: |
          cc -fsyntax-only -std=c99 -D_GNU_SOURCE ds4.c
          cc -fsyntax-only -std=c99 -D_GNU_SOURCE -DDS4_NO_GPU ds4.c
          cc -fsyntax-only -std=c99 -D_GNU_SOURCE -I. native/bridge/ds4_bridge.c
          make test-ds41-bridge-lifetime test-ds41-batch-lifetime test-ds41-spec-plan test-ds41-mtp-bridge
          cc -O1 -g -std=c11 -D_GNU_SOURCE -fsanitize=address,undefined -ffunction-sections -fdata-sections -I. tests/test_ds41_mtp_bridge.c -Wl,--gc-sections -o /tmp/ds41-mtp-bridge-san
          /tmp/ds41-mtp-bridge-san
          cc -O1 -g -std=c11 -fsanitize=address,undefined tests/test_ds41_spec_plan.c -o /tmp/ds41-spec-plan-san
          /tmp/ds41-spec-plan-san
      - name: Host build dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install numpy
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Rust format, native-interface typecheck and serving documentation
        run: |
          cargo fmt --all
          cargo check --locked -p ds4-server --features native
          cargo run --locked -q -p ds4-core --example serving_docs > docs/serving-capabilities.md
      - name: Rust lint
        run: make ci-lint
      - name: Rust regression checks
        run: make ci-rust
      - name: C and Rust parity
        run: make ci-parity
      - name: Model-free regression checks
        run: make ci-model-free
      - name: Save generated source patch
        if: always()
        run: git diff --binary > /tmp/ds41-mtp-generated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds41-mtp-source-patch
          path: /tmp/ds41-mtp-generated.patch
      - name: Commit checked implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "feat(ds41): execute multi-request MTP with packed verification and isolated rollback"
          git push origin HEAD:work/ds41-packed-mtp-20261107
