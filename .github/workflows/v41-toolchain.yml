name: V4.1 offline Rust workspace
on:
  push:
    branches: [feat/v41-continuous]
    paths: [.github/workflows/v41-toolchain.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'hanana-kick/ds4-dfm-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare compiler and locked dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/v41-rust"
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/v41-rust/toolchain.tar.gz" 1.98.0-x86_64-unknown-linux-gnu
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/v41-rust/registry.tar.gz" registry
      - uses: actions/upload-artifact@v4
        with:
          name: v41-offline-rust
          path: ${{ runner.temp }}/v41-rust/
          retention-days: 3
          if-no-files-found: error
